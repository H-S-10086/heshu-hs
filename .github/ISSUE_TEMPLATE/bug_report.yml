name: Bug 反馈
description: 报告一个可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整信息，便于快速定位问题。
        安全问题请勿使用本模板，请参考 SECURITY.md 私下报告。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题现象
      description: 实际发生了什么？你期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序写出操作步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Windows 电脑端
        - Android App
        - 两端都有
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      description: 电脑端底部版本号 / App 设置页版本号
      placeholder: 例如 2.0.0 / 1.8.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: App 内「日志」最后几行，或相关报错截图
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现重复问题
          required: true
        - label: 我已确认使用的是最新版本
          required: false
