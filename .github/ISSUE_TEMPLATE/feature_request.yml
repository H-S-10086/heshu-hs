name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么不便？
      placeholder: 例如：在会议室里手机和电脑不在同一网络，想快速传一份文件……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？界面和数据流大概是什么样？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: 涉及平台
      options:
        - Windows 电脑端
        - Android App
        - 两端都要
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，未发现相同建议
          required: true
